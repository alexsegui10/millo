version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ofm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ofm_user
      POSTGRES_PASSWORD: ofm_password
      POSTGRES_DB: ofm_agency_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofm_user -d ofm_agency_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
